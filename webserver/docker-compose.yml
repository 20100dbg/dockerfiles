services:
  apache:
    build: .
    container_name: apache
    ports:
      - 8000:80
    volumes:
      - www:/var/www/html
    environment:
      - WEB_PORT=${WEB_PORT}
  mysql:
    image: mysql:latest
    container_name: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

volumes:
  mysql_data:
  www:
