services:
  php:
    image: php:8.2-apache
    container_name: apache
    ports:
      - 8000:80
    volumes:
      - ./www:/var/www/html
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - 3306:3306
    volumes:
      - ./data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: "my-secret-password"