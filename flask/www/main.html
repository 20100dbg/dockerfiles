<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <script src="/static/socket.io.js"></script>
    <title>Hello world</title>
  </head>
  <body>

<br><br>
<input type="text" id="str" value="Hello world"><button onclick="send_request();">Send</button>

<script type="text/javascript">
const socket = io();
let id = 0;

socket.on("connect", () => {
  console.log('connected');
});

socket.on("disconnect", () => {
  console.log('disconnected');
});

function send_request() {
  id += 1;
  str = document.getElementById('str').value;
  socket.emit("call_server", { 'id': id, 'str': str });
}

socket.on("receive_from_server", (params) => {
  let div = document.getElementById('str');
  div.value = params['result'];
});


</script>

  </body>
</html>
