services:

  attacker:
    hostname: attacker
    container_name: pivot0-attacker
    build:
      dockerfile: attacker/attacker.Dockerfile
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - network0

  front:
    hostname: front
    container_name: pivot1-front
    image: dockurr/windows
    environment:
      VERSION: "2008"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8006:8006
      - 3389:3389/tcp
      - 3389:3389/udp
    volumes:
      - ./windows_storage_front:/storage
      - ./victim/windows_script:/oem
      - ./victim/windows_script/win2008r2.iso:/custom.iso
    restart: always
    stop_grace_period: 2m
    networks:
      - network0
      - network1


  middle:
    hostname: middle
    container_name: pivot2-middle
    image: dockurr/windows
    environment:
      VERSION: "2008"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - 8007:8006
      - 3390:3389/tcp
      - 3390:3389/udp
    volumes:
      - ./windows_storage_middle:/storage
      - ./victim/windows_script:/oem
      - ./victim/windows_script/win2008r2.iso:/custom.iso
    restart: always
    stop_grace_period: 2m
    networks:
      - network1


networks:
  network0:
    ipam:
      driver: default
      config:
        - subnet: 10.0.0.0/24
          gateway: 10.0.0.254
  network1:
    ipam:
      driver: default
      config:
        - subnet: 10.0.1.0/24
          gateway: 10.0.1.254
