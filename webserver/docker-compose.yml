services:
  apache:
    build: .
    container_name: apache
    user: "1000:1000"
    ports:
      - ${WEB_PORT}:80
    volumes:
      - ./www:/var/www/html
    environment:
      - WEB_PORT=${WEB_PORT}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
  mysql:
    image: mysql:latest
    container_name: mysql
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

volumes:
  mysql_data:
